<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2 - Form Bootstrap</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        .page-title {
            color: #2c3e50;
            font-weight: 600;
        }

        .form-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 1.5rem 1.75rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9ecef;
            height: 100%;
        }

        .form-card h2 {
            color: #2c3e50;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #e9ecef;
        }

        .form-label {
            color: #495057;
            font-weight: 500;
            margin-bottom: 0.35rem;
            font-size: 0.95rem;
        }

        .form-control,
        .form-select {
            border: 1px solid #ced4da;
            border-radius: 6px;
            padding: 0.55rem 0.85rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .form-control::placeholder {
            color: #adb5bd;
            font-size: 0.9rem;
        }

        .btn-submit {
            background-color: #0d6efd;
            border: none;
            padding: 0.55rem 1.5rem;
            font-weight: 500;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #0b5ed7;
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .gender-group {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding-top: 0.25rem;
        }

        .form-check-input:checked {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        .form-check-input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .terms-check {
            margin-top: 0.25rem;
        }

        .terms-check label {
            color: #495057;
            font-size: 0.92rem;
            cursor: pointer;
        }

        @media (max-width: 767.98px) {
            .form-card {
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="row g-4">

            <div class="col-md-6">
                <div class="form-card">
                    <h2>Form Đăng Ký Thông Tin</h2>

                    <form id="registerForm" novalidate>
                    
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Họ và Tên</label>
                            <input
                                type="text"
                                class="form-control"
                                id="fullName"
                                name="fullName"
                                placeholder="Nhập họ và tên"
                                required>
                        </div>

  
                        <div class="mb-3">
                            <label for="regEmail" class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="regEmail"
                                name="email"
                                placeholder="Nhập email"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Số Điện Thoại</label>
                            <input
                                type="tel"
                                class="form-control"
                                id="phone"
                                name="phone"
                                placeholder="Nhập số điện thoại"
                                pattern="[0-9]{10,11}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="regPassword" class="form-label">Mật Khẩu</label>
                            <input
                                type="password"
                                class="form-control"
                                id="regPassword"
                                name="password"
                                placeholder="Nhập mật khẩu"
                                minlength="6"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Xác Nhận Mật Khẩu</label>
                            <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Xác nhận mật khẩu"
                                minlength="6"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-block">Giới Tính:</label>
                            <div class="gender-group">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="genderMale"
                                        value="Nam"
                                        checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="genderFemale"
                                        value="Nữ">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="language" class="form-label">Ngôn Ngữ</label>
                            <select class="form-select" id="language" name="language">
                                <option value="vi" selected>Tiếng Việt</option>
                                <option value="en">English</option>
                                <option value="ja">日本語</option>
                                <option value="zh">中文</option>
                                <option value="fr">Français</option>
                            </select>
                        </div>

                        <div class="mb-4 form-check terms-check">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="agreeTerms"
                                name="agreeTerms"
                                required>
                            <label class="form-check-label" for="agreeTerms">
                                Tôi đồng ý với các điều khoản và điều kiện
                            </label>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-primary btn-submit">
                            Đăng Ký
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-card">
                    <h2>Form Đăng nhập</h2>

                    <form id="loginForm" novalidate>
                        <!-- Email -->
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="loginEmail"
                                name="email"
                                placeholder="Nhập email"
                                required>
                        </div>

                        <!-- Mật Khẩu -->
                        <div class="mb-4">
                            <label for="loginPassword" class="form-label">Mật Khẩu</label>
                            <input
                                type="password"
                                class="form-control"
                                id="loginPassword"
                                name="password"
                                placeholder="Nhập mật khẩu"
                                required>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-primary btn-submit">
                            Đăng Nhập
                        </button>
                    </form>
                </div>
            </div>

        </div>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Validate mật khẩu khớp nhau
        (function () {
            const registerForm = document.getElementById('registerForm');
            const password = document.getElementById('regPassword');
            const confirm = document.getElementById('confirmPassword');

            registerForm.addEventListener('submit', function (e) {
                e.preventDefault();
                if (!registerForm.checkValidity()) {
                    registerForm.reportValidity();
                    return;
                }
                if (password.value !== confirm.value) {
                    confirm.setCustomValidity('Mật khẩu xác nhận không khớp');
                    confirm.reportValidity();
                    return;
                }
                confirm.setCustomValidity('');
                alert('Đăng ký thành công!');
                registerForm.reset();
            });

            confirm.addEventListener('input', function () {
                confirm.setCustomValidity('');
            });

            document.getElementById('loginForm').addEventListener('submit', function (e) {
                e.preventDefault();
                if (!this.checkValidity()) {
                    this.reportValidity();
                    return;
                }
                alert('Đăng nhập thành công!');
                this.reset();
            });
        })();
    </script>
</body>
</html>
