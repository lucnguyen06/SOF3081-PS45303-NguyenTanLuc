<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Thành Phần Dinh Dưỡng</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
        }

        .container-custom {
            width: 450px;
            max-width: 95%;
            margin: 30px auto;
        }

        .title {
            color: #ff3333;
            text-align: center;
            font-size: 23px;
            font-weight: 400;
            margin: 5px 0 18px;
        }

        .table-box {
            border: 1px solid #d6d6d6;
            padding: 8px 7px;
            background: #fff;
        }

        .nutrition-table {
            width: 100%;
            margin: 0;
            border-collapse: collapse;
            font-size: 14px;
        }

        .nutrition-table th,
        .nutrition-table td {
            border: 1px solid #dee2e6;
            padding: 8px 7px;
            vertical-align: middle;
        }

        .nutrition-table thead th {
            background: #ffbd17;
            color: #111;
            text-align: center;
            font-weight: 700;
        }

        .nutrition-table thead tr:first-child th {
            height: 34px;
        }

        .nutrition-table thead tr:nth-child(2) th {
            height: 34px;
        }

        .nutrition-table tbody td {
            height: 34px;
        }

        .nutrition-table tbody td:nth-child(2),
        .nutrition-table tbody td:nth-child(3) {
            text-align: left;
        }

        .nutrition-table th:first-child {
            width: 45%;
        }

        .nutrition-table th:nth-child(2) {
            width: 33%;
        }

        .nutrition-table th:nth-child(3) {
            width: 22%;
        }

        .note {
            margin-top: 18px;
            font-size: 18px;
        }

        .note strong {
            font-weight: 700;
        }

        @media (max-width: 500px) {
            .container-custom {
                width: 95%;
            }

            .title {
                font-size: 20px;
            }

            .nutrition-table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="container-custom">

        <h1 class="title">Bảng Thành Phần Dinh Dưỡng</h1>

        <div class="table-box">
            <table class="table nutrition-table">
                <thead>
                    <tr>
                        <th rowspan="2">Thành Phần</th>
                        <th colspan="2">Giá Trị</th>
                    </tr>
                    <tr>
                        <th>Khối Lượng</th>
                        <th>% DV*</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Calories</td>
                        <td>200 kcal</td>
                        <td>20%</td>
                    </tr>
                    <tr>
                        <td>Chất Béo</td>
                        <td>9 g</td>
                        <td>14%</td>
                    </tr>
                    <tr>
                        <td>Chất Béo Bão Hòa</td>
                        <td>4 g</td>
                        <td>20%</td>
                    </tr>
                    <tr>
                        <td>Chất Đạm</td>
                        <td>8 g</td>
                        <td>16%</td>
                    </tr>
                    <tr>
                        <td>Chất Xơ</td>
                        <td>5 g</td>
                        <td>20%</td>
                    </tr>
                    <tr>
                        <td>Đường</td>
                        <td>12 g</td>
                        <td>-</td>
                    </tr>
                    <tr>
                        <td rowspan="2">Vitamin</td>
                        <td>Vitamin C</td>
                        <td>25%</td>
                    </tr>
                    <tr>
                        <td>Vitamin D</td>
                        <td>10%</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</body>
</html>
