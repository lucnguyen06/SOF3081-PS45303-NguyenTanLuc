<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3 - Form với Tab Bootstrap</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding-top: 2.5rem;
            padding-bottom: 2.5rem;
        }

        .page-header {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            font-size: 1rem;
            opacity: 0.95;
        }

        .tab-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            max-width: 600px;
            margin: 0 auto;
        }

        .nav-tabs {
            border-bottom: none;
            background: #f8f9fa;
            padding: 1rem 1rem 0;
        }

        .nav-tabs .nav-link {
            border: none;
            border-radius: 8px 8px 0 0;
            color: #6c757d;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            margin-right: 0.25rem;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-tabs .nav-link:hover {
            color: #0d6efd;
            background: rgba(13, 110, 253, 0.05);
        }

        .nav-tabs .nav-link.active {
            color: #0d6efd;
            background: #ffffff;
            font-weight: 600;
            border-bottom: 3px solid #0d6efd;
        }

        .tab-content {
            padding: 2rem 2rem 2.5rem;
        }

        .form-label {
            color: #495057;
            font-weight: 500;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }

        .form-control,
        .form-select {
            border: 1px solid #ced4da;
            border-radius: 6px;
            padding: 0.6rem 0.9rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .form-control::placeholder {
            color: #adb5bd;
            font-size: 0.9rem;
        }

        .btn-submit {
            background-color: #0d6efd;
            border: none;
            padding: 0.65rem 2rem;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-submit:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .gender-group {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding-top: 0.25rem;
        }

        .form-check-input:checked {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        .form-check-input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .terms-check label {
            color: #495057;
            font-size: 0.92rem;
            cursor: pointer;
        }

        .tab-icon {
            margin-right: 0.35rem;
        }

        .divider {
            margin: 1.5rem 0;
            border-top: 1px solid #e9ecef;
        }

        @media (max-width: 767.98px) {
            .tab-container {
                margin: 0 1rem;
            }

            .tab-content {
                padding: 1.5rem 1.25rem;
            }

            .nav-tabs .nav-link {
                padding: 0.65rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Page header -->
        <div class="page-header">
            <h1>
                <i class="bi bi-ui-checks-grid"></i> Bài 3: Kết hợp Form và Tab
            </h1>
            <p>Sử dụng Toggleable / Dynamic Tabs để chứa Form Đăng ký và Đăng nhập</p>
        </div>

        <!-- Tab Container -->
        <div class="tab-container">

            <!-- Nav Tabs -->
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button
                        class="nav-link active"
                        id="register-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#register"
                        type="button"
                        role="tab"
                        aria-controls="register"
                        aria-selected="true">
                        <i class="bi bi-person-plus-fill tab-icon"></i>Đăng Ký
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button
                        class="nav-link"
                        id="login-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#login"
                        type="button"
                        role="tab"
                        aria-controls="login"
                        aria-selected="false">
                        <i class="bi bi-box-arrow-in-right tab-icon"></i>Đăng Nhập
                    </button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content" id="myTabContent">

                <!-- TAB 1: Form Đăng Ký Thông Tin -->
                <div
                    class="tab-pane fade show active"
                    id="register"
                    role="tabpanel"
                    aria-labelledby="register-tab">

                    <form id="registerForm" novalidate>
                        <!-- Họ và Tên -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Họ và Tên</label>
                            <input
                                type="text"
                                class="form-control"
                                id="fullName"
                                name="fullName"
                                placeholder="Nhập họ và tên"
                                required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="regEmail" class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="regEmail"
                                name="email"
                                placeholder="Nhập email"
                                required>
                        </div>

                        <!-- Số Điện Thoại -->
                        <div class="mb-3">
                            <label for="phone" class="form-label">Số Điện Thoại</label>
                            <input
                                type="tel"
                                class="form-control"
                                id="phone"
                                name="phone"
                                placeholder="Nhập số điện thoại"
                                pattern="[0-9]{10,11}"
                                required>
                        </div>

                        <!-- Mật Khẩu -->
                        <div class="mb-3">
                            <label for="regPassword" class="form-label">Mật Khẩu</label>
                            <input
                                type="password"
                                class="form-control"
                                id="regPassword"
                                name="password"
                                placeholder="Nhập mật khẩu"
                                minlength="6"
                                required>
                        </div>

                        <!-- Xác Nhận Mật Khẩu -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Xác Nhận Mật Khẩu</label>
                            <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Xác nhận mật khẩu"
                                minlength="6"
                                required>
                        </div>

                        <!-- Giới Tính -->
                        <div class="mb-3">
                            <label class="form-label d-block">Giới Tính:</label>
                            <div class="gender-group">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="genderMale"
                                        value="Nam"
                                        checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="genderFemale"
                                        value="Nữ">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                            </div>
                        </div>

                        <!-- Ngôn Ngữ -->
                        <div class="mb-3">
                            <label for="language" class="form-label">Ngôn Ngữ</label>
                            <select class="form-select" id="language" name="language">
                                <option value="vi" selected>Tiếng Việt</option>
                                <option value="en">English</option>
                                <option value="ja">日本語</option>
                                <option value="zh">中文</option>
                                <option value="fr">Français</option>
                            </select>
                        </div>

                        <!-- Checkbox điều khoản -->
                        <div class="mb-4 form-check terms-check">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="agreeTerms"
                                name="agreeTerms"
                                required>
                            <label class="form-check-label" for="agreeTerms">
                                Tôi đồng ý với các điều khoản và điều kiện
                            </label>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-primary btn-submit">
                            <i class="bi bi-check-circle me-2"></i>Đăng Ký
                        </button>
                    </form>

                </div>

                <!-- TAB 2: Form Đăng nhập -->
                <div
                    class="tab-pane fade"
                    id="login"
                    role="tabpanel"
                    aria-labelledby="login-tab">

                    <form id="loginForm" novalidate>
                        <!-- Email -->
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="loginEmail"
                                name="email"
                                placeholder="Nhập email"
                                required>
                        </div>

                        <!-- Mật Khẩu -->
                        <div class="mb-4">
                            <label for="loginPassword" class="form-label">Mật Khẩu</label>
                            <input
                                type="password"
                                class="form-control"
                                id="loginPassword"
                                name="password"
                                placeholder="Nhập mật khẩu"
                                required>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-primary btn-submit">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
                        </button>

                        <div class="divider"></div>

                        <p class="text-center text-muted mb-0">
                            Chưa có tài khoản?
                            <a href="#" id="switchToRegister" class="text-decoration-none fw-semibold">Đăng ký ngay</a>
                        </p>
                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Validate mật khẩu khớp nhau
        (function () {
            const registerForm = document.getElementById('registerForm');
            const password = document.getElementById('regPassword');
            const confirm = document.getElementById('confirmPassword');

            registerForm.addEventListener('submit', function (e) {
                e.preventDefault();
                if (!registerForm.checkValidity()) {
                    registerForm.reportValidity();
                    return;
                }
                if (password.value !== confirm.value) {
                    confirm.setCustomValidity('Mật khẩu xác nhận không khớp');
                    confirm.reportValidity();
                    return;
                }
                confirm.setCustomValidity('');
                alert('Đăng ký thành công!');
                registerForm.reset();
            });

            confirm.addEventListener('input', function () {
                confirm.setCustomValidity('');
            });

            document.getElementById('loginForm').addEventListener('submit', function (e) {
                e.preventDefault();
                if (!this.checkValidity()) {
                    this.reportValidity();
                    return;
                }
                alert('Đăng nhập thành công!');
                this.reset();
            });

            // Switch to register tab when "Đăng ký ngay" is clicked
            document.getElementById('switchToRegister').addEventListener('click', function (e) {
                e.preventDefault();
                const registerTab = new bootstrap.Tab(document.getElementById('register-tab'));
                registerTab.show();
            });
        })();
    </script>
</body>
</html>
