<!DOCTYPE html>
<html>
  <head>
    <title>Bootstrap 5</title>
    <meta charset="utf-8">
    <!--Giúp trình duyệt hiển thị đúng theo chiều rộng thiết bị.-->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap css -->
    <!-- Bootstrap JS -->
    
    <style>
      h1 {
        color: blue;
        font-family: verdana;
        font-size: 300%;

      }
      p  {
        color: rgb(51, 255, 0);
        font-family: courier;
        font-size: 160%;
      }
      #p01 {

      }
      .color {
        color: rgb(255, 0, 0);
      }

      th {
          background-color: greenyellow;
      }

      tr {
          background-color: #00c3ff;
      }

      table {
          border-collapse: collapse;
          width: 60%;
      }

      table, th, td {
          border: 1px solid black;
      }
      tr:hover {
          background-color: yellow;
      }
    </style>
  </head>
  <body>
